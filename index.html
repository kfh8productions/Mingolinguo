<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mingo Linguo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e10;          /* Mingo dark */
    --bg2: #17171b;
    --ink: #f4f1e6;          /* warm paper text on dark */
    --pink: #ff4d8d;         /* Mingo flamingo pink - primary brand */
    --gold: #ffb000;         /* beak/tassel amber - reveal highlight */
    --red: #e0444f;          /* miss */
    --green: #46c08a;        /* hit */
    --dim: #8a8a93;          /* muted grey */
    --card: #1c1c21;
    --line: #2c2c33;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% -10%, var(--bg2), var(--bg) 70%);
    color: var(--ink);
    font-family: "DM Mono", monospace;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* ---- header ---- */
  header {
    padding: 14px 20px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .brand-row { display: flex; align-items: center; gap: 10px; }
  .logo { width: 34px; height: 34px; flex: none; display: block; }
  .brand {
    font-family: "Bebas Neue", sans-serif;
    font-size: 30px;
    letter-spacing: 2px;
    line-height: 1;
  }
  .brand span { color: var(--pink); }
  .lang-tag {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--dim);
  }

  /* ---- progress strip ---- */
  .stats {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--line);
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--dim);
  }
  .stat {
    flex: 1;
    padding: 8px 4px;
    text-align: center;
    border-right: 1px solid var(--line);
  }
  .stat:last-child { border-right: none; }
  .stat b {
    display: block;
    font-family: "Bebas Neue", sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    color: var(--ink);
    margin-top: 2px;
  }
  .stat.due b { color: var(--gold); }

  /* ---- stage ---- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    gap: 22px;
  }

  .deck-counter {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--dim);
    text-transform: uppercase;
  }

  /* ---- flip card ---- */
  .card-shell {
    width: 100%;
    max-width: 420px;
    aspect-ratio: 3 / 2;
    perspective: 1400px;
    cursor: pointer;
  }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s cubic-bezier(.2,.7,.2,1);
    transform-style: preserve-3d;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: linear-gradient(160deg, var(--card), var(--bg2));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
  }
  .face .eyebrow {
    position: absolute;
    top: 14px;
    left: 16px;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--dim);
  }
  .face .meta {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 11px;
    color: var(--dim);
  }
  .word {
    font-family: "Bebas Neue", sans-serif;
    font-size: clamp(44px, 13vw, 76px);
    letter-spacing: 1px;
    line-height: 1;
  }
  .back { transform: rotateY(180deg); }
  .back .word { color: var(--gold); }
  .note {
    margin-top: 10px;
    font-size: 12px;
    color: var(--dim);
  }
  .speak {
    position: absolute;
    bottom: 12px;
    right: 14px;
    background: none;
    border: 1px solid var(--line);
    color: var(--dim);
    border-radius: 8px;
    padding: 4px 8px;
    font-family: "DM Mono", monospace;
    font-size: 14px;
    cursor: pointer;
  }
  .speak:active { color: var(--gold); }
  .flip-hint {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--dim);
  }

  /* ---- grade buttons ---- */
  .grade {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 420px;
  }
  .grade button {
    flex: 1;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--ink);
    font-family: "Bebas Neue", sans-serif;
    font-size: 22px;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: transform .08s, background .15s, border-color .15s;
  }
  .grade button:active { transform: translateY(2px); }
  .grade .miss { border-color: var(--red); }
  .grade .miss:active { background: var(--red); }
  .grade .hit { border-color: var(--green); }
  .grade .hit:active { background: var(--green); }

  /* ---- done / empty screens ---- */
  .panel {
    text-align: center;
    max-width: 420px;
  }
  .panel h2 {
    font-family: "Bebas Neue", sans-serif;
    font-size: 44px;
    letter-spacing: 2px;
    margin: 0 0 8px;
  }
  .panel p { color: var(--dim); font-size: 13px; line-height: 1.6; }
  .panel button {
    margin-top: 18px;
    padding: 14px 28px;
    border: 1px solid var(--gold);
    border-radius: 12px;
    background: none;
    color: var(--gold);
    font-family: "Bebas Neue", sans-serif;
    font-size: 22px;
    letter-spacing: 1.5px;
    cursor: pointer;
  }
  .panel button:active { background: var(--gold); color: var(--bg); }

  .hidden { display: none !important; }

  /* ---- footer controls ---- */
  footer {
    border-top: 1px solid var(--line);
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 1px;
  }
  footer button {
    background: none;
    border: none;
    color: var(--dim);
    font-family: "DM Mono", monospace;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    text-transform: uppercase;
  }
  footer button:active { color: var(--red); }

  /* ---- direction toggle ---- */
  .dirbar {
    display: flex;
    border-bottom: 1px solid var(--line);
  }
  .dirbar button {
    flex: 1;
    padding: 10px 4px;
    background: none;
    border: none;
    border-right: 1px solid var(--line);
    color: var(--dim);
    font-family: "DM Mono", monospace;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
  }
  .dirbar button:last-child { border-right: none; }
  .dirbar button.active {
    color: var(--bg);
    background: var(--pink);
  }
  .dirbar .arrow { opacity: 0.6; padding: 0 4px; }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand-row">
    <svg class="logo" id="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-label="Mingo flamingo in a graduation cap"></svg>
    <div class="brand">MINGO <span>LINGUO</span></div>
  </div>
  <div class="lang-tag" id="langTag">--</div>
</header>

<div class="dirbar">
  <button id="dirEn2Fw" data-dir="en2fw" type="button">English <span class="arrow">&#8594;</span> <span id="dirFwLabel1">Romanian</span></button>
  <button id="dirFw2En" data-dir="fw2en" type="button"><span id="dirFwLabel2">Romanian</span> <span class="arrow">&#8594;</span> English</button>
</div>

<div class="stats">
  <div class="stat due"><span>due today</span><b id="stDue">0</b></div>
  <div class="stat"><span>new</span><b id="stNew">0</b></div>
  <div class="stat"><span>learned</span><b id="stLearned">0</b></div>
  <div class="stat"><span>mastered</span><b id="stMastered">0</b></div>
</div>

<main id="stage">

  <!-- SESSION VIEW -->
  <div id="sessionView" class="hidden" style="display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;">
    <div class="deck-counter" id="counter">0 / 0</div>
    <div class="card-shell" id="cardShell">
      <div class="card" id="card">
        <div class="face front">
          <div class="eyebrow" id="frontEyebrow">English</div>
          <div class="meta" id="frontMeta"></div>
          <div class="word" id="frontWord">--</div>
        </div>
        <div class="face back">
          <div class="eyebrow" id="backLangLabel">Romanian</div>
          <div class="meta" id="backMeta"></div>
          <div class="word" id="backWord">--</div>
          <div class="note" id="backNote"></div>
          <button class="speak" id="speakBtn" type="button" aria-label="Speak Romanian">&#9654;</button>
        </div>
      </div>
    </div>
    <div class="flip-hint" id="flipHint">Tap card to reveal</div>
    <div class="grade hidden" id="gradeRow">
      <button class="miss" data-act="miss" type="button">Missed it</button>
      <button class="hit" data-act="hit" type="button">Got it</button>
    </div>
  </div>

  <!-- DONE VIEW -->
  <div id="doneView" class="panel hidden">
    <h2 id="doneTitle">Session done</h2>
    <p id="doneBody"></p>
    <button id="restartBtn" type="button">Again</button>
  </div>

</main>

<footer>
  <span id="footStatus">--</span>
  <button id="resetBtn" type="button">Reset progress</button>
</footer>

<!-- DROP-IN DECK: swap this line to change language -->
<script src="words-ro.js"></script>

<script>
(function () {
  "use strict";

  // ---- config ----
  var BOXES = [0, 1, 3, 7, 14, 30];   // box index -> days until due
  var MASTERED_BOX = BOXES.length - 1; // box 5 = mastered
  var NEW_PER_SESSION = 20;

  var deck = window.MINGO_DECK;
  var LANG = deck.lang;
  var STORE_KEY = "mingolinguo_" + LANG;

  // ---- el refs ----
  function $(id) { return document.getElementById(id); }
  var sessionView = $("sessionView");
  var doneView = $("doneView");
  var card = $("card");
  var cardShell = $("cardShell");
  var gradeRow = $("gradeRow");
  var flipHint = $("flipHint");

  // ---- state ----
  // dir: "en2fw" (English -> foreign, recognition) or "fw2en" (recall)
  var dir = localStorage.getItem(STORE_KEY + "_dir") || "en2fw";
  var prog = loadProgress();   // single store; keys are namespaced by dir
  var queue = [];
  var idx = 0;
  var flipped = false;
  var sessionHits = 0;
  var sessionMiss = 0;

  $("langTag").textContent = deck.langName;
  $("dirFwLabel1").textContent = deck.langName;
  $("dirFwLabel2").textContent = deck.langName;

  // Mingo flamingo, graduation-cap variant (sibling to MINGOMUSIC's shades version)
  function flamingoInner() {
    return '<path d="M50 84 C48 70 47 60 49 52 C40 50 33 44 33 35 C33 25 41 18 51 18 C62 18 70 26 70 36 C70 45 63 51 56 52 C58 62 58 72 57 84 Z" fill="#ff4d8d"/>' +
      '<path d="M52 84 L52 92 M48 92 L58 92" stroke="#ff4d8d" stroke-width="4" stroke-linecap="round"/>' +
      '<path d="M64 32 L82 38 L64 42 Z" fill="#ffb000"/>' +
      '<path d="M70 40 L82 38 L72 45 Z" fill="#111"/>' +
      '<circle cx="47" cy="33" r="2.4" fill="#0a0a0a"/>' +
      '<circle cx="46.2" cy="32.2" r="0.8" fill="#fff"/>' +
      '<path d="M41 22 Q51 19 61 22 L61 26 Q51 23 41 26 Z" fill="#141414"/>' +
      '<path d="M31 20 L51 13 L71 20 L51 27 Z" fill="#0a0a0a"/>' +
      '<path d="M31 20 L51 13 L71 20" fill="none" stroke="#2c2c2c" stroke-width="0.8"/>' +
      '<circle cx="51" cy="20" r="1.5" fill="#ffb000"/>' +
      '<path d="M51 20 Q64 21 65 23 L65 31" fill="none" stroke="#ffb000" stroke-width="1.3"/>' +
      '<path d="M62.7 31 L67.3 31 L65 37 Z" fill="#ffb000"/>';
  }
  $("logo").innerHTML = flamingoInner();

  // progress key is per-word AND per-direction, so the two skills track apart
  function pkey(w) { return w.key + ":" + dir; }

  // ---- storage ----
  function loadProgress() {
    var raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : {};
  }
  function saveProgress() {
    localStorage.setItem(STORE_KEY, JSON.stringify(prog));
  }
  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }
  function daysBetween(a, b) {
    return Math.round((new Date(b) - new Date(a)) / 86400000);
  }

  // ---- queue building ----
  function buildQueue() {
    var today = todayStr();
    var due = [];
    var fresh = [];
    deck.words.forEach(function (w) {
      var p = prog[pkey(w)];
      if (!p) {
        fresh.push(w);
      } else if (daysBetween(p.due, today) >= 0 && p.box < MASTERED_BOX) {
        due.push(w);
      } else if (daysBetween(p.due, today) >= 0) {
        due.push(w); // mastered but due for a final refresh
      }
    });
    shuffle(due);
    shuffle(fresh);
    return due.concat(fresh.slice(0, NEW_PER_SESSION));
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
  }

  // ---- grading ----
  function grade(key, gotIt) {
    var p = prog[key] || { box: 0 };
    if (gotIt) {
      p.box = Math.min(p.box + 1, MASTERED_BOX);
    } else {
      p.box = 1;
    }
    var d = new Date();
    d.setDate(d.getDate() + BOXES[p.box]);
    p.due = d.toISOString().slice(0, 10);
    prog[key] = p;
    saveProgress();
  }

  // ---- stats ----
  function refreshStats() {
    var today = todayStr();
    var dueCt = 0, newCt = 0, learnedCt = 0, masteredCt = 0;
    deck.words.forEach(function (w) {
      var p = prog[pkey(w)];
      if (!p) { newCt++; return; }
      if (p.box >= MASTERED_BOX) { masteredCt++; }
      else { learnedCt++; }
      if (daysBetween(p.due, today) >= 0) { dueCt++; }
    });
    $("stDue").textContent = dueCt;
    $("stNew").textContent = newCt;
    $("stLearned").textContent = learnedCt;
    $("stMastered").textContent = masteredCt;
    $("footStatus").textContent = deck.words.length + " words \u00b7 " +
      (dir === "en2fw" ? "EN\u2192" + deck.langName.slice(0,2).toUpperCase()
                       : deck.langName.slice(0,2).toUpperCase() + "\u2192EN");
  }

  // ---- rendering ----
  var pendingBack = null;   // answer-side content, revealed only after flip settles

  function showCard() {
    flipped = false;
    card.classList.remove("flipped");
    gradeRow.classList.add("hidden");
    flipHint.classList.remove("hidden");
    var w = queue[idx];
    $("counter").textContent = (idx + 1) + " / " + queue.length;

    var metaBits = [];
    if (w.pos) { metaBits.push(w.pos); }
    if (w.g) { metaBits.push(w.g); }
    var meta = metaBits.join(" \u00b7 ");

    if (dir === "en2fw") {
      // prompt English (front, shown now), answer Romanian (back, held back)
      $("frontEyebrow").textContent = "English";
      $("frontWord").textContent = w.en;
      $("frontMeta").textContent = "";
      pendingBack = { label: deck.langName, word: w.fw, meta: meta, note: w.note || "" };
    } else {
      // prompt Romanian (front, shown now), answer English (back, held back)
      $("frontEyebrow").textContent = deck.langName;
      $("frontWord").textContent = w.fw;
      $("frontMeta").textContent = meta;
      pendingBack = { label: "English", word: w.en, meta: "", note: w.note || "" };
    }
    // back face starts blank so the answer can't be read during the spin
    clearBack();
  }

  function clearBack() {
    $("backLangLabel").textContent = "";
    $("backWord").textContent = "";
    $("backMeta").textContent = "";
    $("backNote").textContent = "";
  }

  function revealBack() {
    if (!pendingBack) { return; }
    $("backLangLabel").textContent = pendingBack.label;
    $("backWord").textContent = pendingBack.word;
    $("backMeta").textContent = pendingBack.meta;
    $("backNote").textContent = pendingBack.note;
  }

  function flip() {
    if (flipped) { return; }
    flipped = true;
    card.classList.add("flipped");
    flipHint.classList.add("hidden");

    // reveal answer + grade buttons only once the card has finished rotating,
    // so the answer is never legible mid-spin
    var revealed = false;
    function onSettled() {
      if (revealed) { return; }
      revealed = true;
      card.removeEventListener("transitionend", onSettled);
      revealBack();
      gradeRow.classList.remove("hidden");
    }
    card.addEventListener("transitionend", onSettled);
    // fallback if transitionend doesn't fire (reduced motion / no transition)
    var reduced = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(onSettled, reduced ? 0 : 600);
  }

  function next() {
    idx++;
    if (idx >= queue.length) { finish(); return; }
    showCard();
  }

  function speak() {
    if (!("speechSynthesis" in window)) { return; }
    var w = queue[idx];
    var u = new SpeechSynthesisUtterance(w.fw);
    u.lang = deck.voice || "en-US";
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }

  // ---- session lifecycle ----
  function start() {
    queue = buildQueue();
    idx = 0;
    sessionHits = 0;
    sessionMiss = 0;
    refreshStats();
    if (queue.length === 0) {
      showDone(true);
      return;
    }
    doneView.classList.add("hidden");
    sessionView.classList.remove("hidden");
    showCard();
  }

  function finish() {
    saveProgress();
    refreshStats();
    showDone(false);
  }

  function showDone(empty) {
    sessionView.classList.add("hidden");
    doneView.classList.remove("hidden");
    if (empty) {
      $("doneTitle").textContent = "All clear";
      $("doneBody").textContent =
        "Nothing due right now. Come back tomorrow, or reset to run through everything again.";
      $("restartBtn").textContent = "Force a round";
    } else {
      $("doneTitle").textContent = "Round done";
      $("doneBody").textContent =
        sessionHits + " got, " + sessionMiss + " missed. " +
        "Missed cards drop back to box 1; the rest move up.";
      $("restartBtn").textContent = "Again";
    }
  }

  // ---- events (delegation where sensible) ----
  cardShell.addEventListener("click", function (e) {
    if (e.target.id === "speakBtn") { return; }
    flip();
  });

  $("speakBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    speak();
  });

  gradeRow.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) { return; }
    var w = queue[idx];
    if (btn.dataset.act === "hit") { grade(pkey(w), true); sessionHits++; }
    else { grade(pkey(w), false); sessionMiss++; }
    next();
  });

  $("restartBtn").addEventListener("click", function () {
    if ($("restartBtn").textContent.indexOf("Force") === 0) {
      // force: serve everything, ignoring due dates, learned first
      queue = deck.words.slice();
      shuffle(queue);
      idx = 0; sessionHits = 0; sessionMiss = 0;
      doneView.classList.add("hidden");
      sessionView.classList.remove("hidden");
      showCard();
    } else {
      start();
    }
  });

  $("resetBtn").addEventListener("click", function () {
    if (window.confirm("Wipe all progress for " + deck.langName + "?")) {
      localStorage.removeItem(STORE_KEY);
      prog = {};
      start();
    }
  });

  // keyboard: space flips, arrows grade
  document.addEventListener("keydown", function (e) {
    if (sessionView.classList.contains("hidden")) { return; }
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      if (!flipped) { flip(); }
    } else if (flipped && (e.key === "ArrowRight" || e.key === "2")) {
      var w = queue[idx]; grade(pkey(w), true); sessionHits++; next();
    } else if (flipped && (e.key === "ArrowLeft" || e.key === "1")) {
      var w2 = queue[idx]; grade(pkey(w2), false); sessionMiss++; next();
    }
  });

  // ---- direction toggle ----
  function setDirActive() {
    $("dirEn2Fw").classList.toggle("active", dir === "en2fw");
    $("dirFw2En").classList.toggle("active", dir === "fw2en");
  }

  function switchDir(newDir) {
    if (newDir === dir) { return; }
    dir = newDir;
    localStorage.setItem(STORE_KEY + "_dir", dir);
    setDirActive();
    start();   // rebuild queue and stats for the new direction
  }

  $("dirEn2Fw").addEventListener("click", function () { switchDir("en2fw"); });
  $("dirFw2En").addEventListener("click", function () { switchDir("fw2en"); });
  setDirActive();

  // ---- go ----
  start();
})();
</script>
</body>
</html>
